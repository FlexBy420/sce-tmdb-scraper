<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <style>
        #scrollToTopBtn { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 99; padding: 10px; font-size: 16px; border: none; outline: none; background-color: #333; color: #fff; cursor: pointer; border-radius: 50%; }
        #scrollToTopBtn:hover { background-color: #555; }
        #scrollToTopBtn::after { content: '\25B2'; }
        #table th { cursor: pointer; }
        #table th:hover { text-decoration: underline; }
    </style>
    <title>SCE-TMDB</title>
</head>
<body>
    <div class="container custom-width">
        <header>
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">SCE-TMDB</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" href="#" data-console="all">All</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-console="PS3">PS3</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-console="PS4">PS4</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-console="ps3,psp">PSP</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="https://github.com/FlexBy420/sce-tmdb-scraper" target="_blank" rel="noopener noreferrer">
                                    <i class="bi bi-github"></i> Source Code
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <div class="container mt-2 custom-width">
            <div id="loading_progress" class="progress" role="progressbar" aria-label="Data loading and processing progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="loading_status" class="progress-bar" style="width: 0">Loading…</div>
            </div>
            <div id="table_container" class="row mt-2 table-responsive d-none">
                <div class="p-2 position-relative">
                    <input id="filter" class="form-control form-control-lg" type="text" placeholder="Search by Product Code or Title" aria-label="Game filter">
                    <button id="clear_button" type="button" class="btn rounded-pill text-secondary form-control-clear position-absolute top-0 end-0 d-none">
                        <span class="bi bi-x-circle-fill"></span>
                    </button>
                </div>
                <div id="pagination" class="d-flex justify-content-center mt-3"></div>
                <span id="game_count" class="text-center d-block mt-2"></span> 
                <table class="table table-hover" id="table">
                    <thead>
                        <tr>
                            <th>Product Code</th>
                            <th>Title</th>
                            <th>Console</th>
                            <th>Parental Level</th>
                            <th>Icon</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- parsed data -->
                    </tbody>
                </table>
            </div>
        </div>       
        <footer>
            <div class="row">
                <span id="version" class="text-body-tertiary text-end">v1.1</span>
            </div>
        </footer>
    </div>
    <button onclick="scrollToTop()" id="scrollToTopBtn" title="Go to top"></button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
