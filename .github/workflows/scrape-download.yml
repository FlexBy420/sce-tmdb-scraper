name: TMDB Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run TMDB scraper
        run: |
          python tmdb-scraper.py --all

      - name: Create XML zip
        run: |
          if [ -d "xml" ]; then
            zip -r xml.zip xml
          fi

      - name: Create JSON zip
        run: |
          if [ -d "json" ]; then
            zip -r json.zip json
          fi

      - name: Create TMDB JSON zip
        run: |
          if [ -f "log/tmdb.json" ]; then
            zip -j tmdb.zip log/tmdb.json
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tmdb-artifacts
          path: |
            xml.zip
            json.zip
            tmdb.zip